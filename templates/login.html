<!DOCTYPE html>
<html>
<head><title>Cyber Phish - Login</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #070d1a;
        font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #e0e0e0;
        position: relative;
        overflow: hidden;
        padding: 20px;
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 20% 30%, #0f1a3a, #070d1a 70%);
        z-index: -2;
    }
    body::after {
        content: '';
        position: fixed;
        inset: 0;
        background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2300ffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        opacity: 0.3;
        z-index: -1;
    }

    .container { max-width: 500px; width: 100%; }

    .glass-card {
        background: rgba(10, 18, 34, 0.65);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 40px;
        border: 1px solid rgba(0, 255, 255, 0.15);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 255, 255, 0.05) inset;
        padding: 40px 32px;
        transition: 0.4s ease;
        position: relative;
        overflow: hidden;
    }
    .glass-card::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle at 30% 20%, rgba(0, 255, 255, 0.03), transparent 60%);
        pointer-events: none;
    }

    .brand {
        font-size: 2.2rem;
        font-weight: 800;
        text-align: center;
        background: linear-gradient(135deg, #00ffff, #a855f7);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 10px;
    }
    .brand i {
        font-size: 2.5rem;
        color: #00ffff;
        text-shadow: 0 0 20px #00ffff;
    }
    .brand small {
        font-size: 0.9rem;
        opacity: 0.6;
        font-weight: 400;
        background: rgba(255,255,255,0.05);
        padding: 2px 14px;
        border-radius: 40px;
        border: 1px solid rgba(255,255,255,0.06);
    }

    .sub-title {
        text-align: center;
        color: #8ae6e6;
        font-size: 0.95rem;
        margin-bottom: 24px;
        letter-spacing: 1px;
        font-weight: 300;
    }

    /* ✅ এরর মেসেজ স্টাইল */
    .error-box {
        background: rgba(255, 50, 50, 0.08);
        border: 1px solid rgba(255, 50, 50, 0.2);
        border-radius: 60px;
        padding: 12px 20px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #ff8a8a;
        font-size: 0.9rem;
        font-weight: 500;
        backdrop-filter: blur(4px);
        animation: shake 0.4s ease;
    }
    .error-box i {
        font-size: 1.2rem;
        color: #ff6a6a;
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        75% { transform: translateX(6px); }
    }

    .form-group {
        margin-bottom: 18px;
    }
    .form-group label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: #8ae6e6;
        margin-bottom: 6px;
        letter-spacing: 0.5px;
    }
    .form-group .input-wrapper {
        position: relative;
    }
    .form-group .input-wrapper i {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: #4a6a7a;
        font-size: 1.1rem;
        transition: 0.3s;
    }
    .form-group input {
        width: 100%;
        padding: 14px 18px 14px 48px;
        border-radius: 60px;
        border: 1px solid rgba(0, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.4);
        color: #fff;
        font-size: 1rem;
        transition: 0.3s;
        outline: none;
        font-family: inherit;
    }
    .form-group input:focus {
        border-color: #00ffff;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.08), inset 0 0 20px rgba(0, 255, 255, 0.02);
        background: rgba(0, 0, 0, 0.6);
    }
    .form-group input:focus + i {
        color: #00ffff;
    }
    .form-group input::placeholder {
        color: #4a6a7a;
    }

    .btn-login {
        width: 100%;
        padding: 14px 20px;
        border: none;
        border-radius: 60px;
        background: linear-gradient(135deg, #00c8ff, #0070ff);
        color: #fff;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s ease;
        box-shadow: 0 8px 25px rgba(0, 100, 255, 0.25);
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: inherit;
    }
    .btn-login:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(0, 100, 255, 0.4);
        background: linear-gradient(135deg, #00ddff, #0080ff);
    }
    .btn-login:active {
        transform: scale(0.97);
    }

    .auth-links {
        text-align: center;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid rgba(0, 255, 255, 0.06);
    }
    .auth-links a {
        color: #8ae6e6;
        text-decoration: none;
        font-weight: 500;
        transition: 0.3s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 16px;
        border-radius: 40px;
        background: rgba(0, 255, 255, 0.04);
        border: 1px solid transparent;
    }
    .auth-links a:hover {
        color: #b0fff0;
        background: rgba(0, 255, 255, 0.08);
        border-color: rgba(0, 255, 255, 0.1);
    }

    @media (max-width: 480px) {
        .glass-card { padding: 28px 20px; }
        .brand { font-size: 1.6rem; }
        .brand i { font-size: 2rem; }
        .form-group input { padding: 12px 16px 12px 42px; font-size: 0.9rem; }
        .btn-login { font-size: 1rem; padding: 12px 16px; }
        .error-box { font-size: 0.8rem; padding: 10px 16px; }
    }
</style>
</head>
<body>
<div class="container">
    <div class="glass-card">

        <div class="brand">
            <i class="fas fa-shield-halved"></i>
            CYBER PHISH
            <small>v2.0</small>
        </div>
        <div class="sub-title"><i class="fas fa-lock" style="margin-right: 8px;"></i> Secure Access</div>

        <!-- ✅ এরর মেসেজ দেখানো -->
        {% if error %}
        <div class="error-box">
            <i class="fas fa-exclamation-circle"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/phis/login">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Username</label>
                <div class="input-wrapper">
                    <input type="text" name="username" placeholder="Enter your username" required>
                    <i class="fas fa-user"></i>
                </div>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <div class="input-wrapper">
                    <input type="password" name="password" placeholder="Enter your password" required>
                    <i class="fas fa-key"></i>
                </div>
            </div>
            <button type="submit" class="btn-login"><i class="fas fa-arrow-right-to-bracket"></i> Login</button>
        </form>

        <div class="auth-links">
            <a href="/phis/register"><i class="fas fa-user-plus"></i> Create new account</a>
        </div>

    </div>
</div>
</body>
                                                                                           </html>
