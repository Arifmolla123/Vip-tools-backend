<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        body{ background:#0b0e14; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
        .login-box{ background:#141c28; padding:40px; border-radius:16px; border:1px solid #2a3a50; max-width:400px; width:100%; }
        h2{ color:#ff6b6b; margin-bottom:20px; }
        input{ width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #2a3a50; background:#0b0e14; color:#fff; }
        .btn{ background:#ff6b6b; border:none; padding:12px; border-radius:8px; width:100%; font-weight:bold; cursor:pointer; }
        .error{ color:#ff6b6b; margin:10px 0; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>🔐 Admin Login</h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
        <input type="password" name="password" placeholder="Enter password" required>
        <button type="submit" class="btn">Login</button>
    </form>
</div>
</body>
</html>
